<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos | Hello Balloons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/hb-app.css" />
  <link rel="stylesheet" href="assets/css/hb-public.css" />
  <style>
    .hb-danger-button{background:#fff;color:#a1284b;border:1px solid rgba(226,85,123,.28);box-shadow:none}.hb-danger-button:hover{background:#fff6f8}.hb-order-card{display:grid;gap:12px}.hb-order-meta{display:flex;gap:10px;flex-wrap:wrap}.hb-order-meta span{background:#f7f9fa;border:1px solid var(--hb-line);border-radius:999px;padding:8px 10px;font-size:.86rem;font-weight:800;color:var(--hb-muted)}.hb-order-actions{display:flex;gap:10px;flex-wrap:wrap}.hb-order-actions select{border:1px solid #dfe5e8;border-radius:999px;padding:10px 12px;font:inherit;background:#fff}
  </style>
</head>
<body>
  <nav class="hb-nav">
    <div class="hb-nav-inner">
      <a class="hb-brand" href="dashboard.html"><img src="https://i.imgur.com/41t5f0K.png" alt="Hello Balloons" /><span>Dashboard</span></a>
      <div class="hb-nav-links">
        <a href="dashboard.html">Inicio</a>
        <a class="active" href="admin.html">Pedidos</a>
        <a href="admin-galeria.html">Galería</a>
        <a href="inventario-app.html">Inventario</a>
        <a href="rutas.html">Rutas</a>
        <a href="cotizador.html">Cotizador</a>
        <a href="memoria-eventos.html">Memoria</a>
        <a href="index.html">Web pública</a>
      </div>
    </div>
  </nav>

  <main class="hb-section">
    <div class="hb-container">
      <div id="loginRequired" class="hb-card pad" style="display:none">
        <h2>Necesitas iniciar sesión</h2>
        <p class="hb-muted">Esta página es interna.</p>
        <a class="hb-button pink" href="login.html">Ir al login</a>
      </div>

      <div id="ordersPanel" style="display:none">
        <div class="hb-section-header">
          <div>
            <div class="hb-eyebrow">Panel interno</div>
            <h2>Pedidos recibidos</h2>
            <p class="hb-muted">Revisa solicitudes de clientes, datos de contacto, ubicación y notas del pedido.</p>
          </div>
          <div class="hb-actions" style="margin-top:0">
            <button id="refreshButton" class="hb-button secondary" type="button">Actualizar</button>
            <button id="logoutButton" class="hb-button secondary" type="button">Salir</button>
          </div>
        </div>

        <div id="message" class="hb-alert info" style="display:none;margin-bottom:18px"></div>
        <div id="ordersGrid" class="hb-grid-2"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js?v=nav3"></script>
  <script src="assets/js/hb-core.js?v=nav3"></script>
  <script>
    function showMessage(text, kind = 'info') {
      const box = document.getElementById('message');
      box.className = `hb-alert ${kind}`;
      box.textContent = text;
      box.style.display = 'block';
    }

    function statusLabel(status) {
      const labels = { new: 'Nuevo', contacted: 'Contactado', quoted: 'Cotizado', confirmed: 'Confirmado', completed: 'Completado', cancelled: 'Cancelado' };
      return labels[status] || status || 'Nuevo';
    }

    function mapsLink(text) {
      if (!text) return '';
      const url = String(text).match(/https?:\/\/[^\s]+/);
      return url ? url[0] : '';
    }

    function orderCard(order) {
      const link = mapsLink(order.event_address || order.notes || '');
      return `
        <article class="hb-card pad hb-order-card">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
            <div>
              <h3>${window.HB.escapeHtml(order.order_number || 'Pedido')}</h3>
              <p class="hb-muted">${window.HB.escapeHtml(order.client_name || 'Sin cliente')} · ${window.HB.escapeHtml(order.client_phone || 'Sin teléfono')}</p>
            </div>
            <span class="hb-status ${order.status === 'new' ? 'amarillo' : 'verde'}">${window.HB.escapeHtml(statusLabel(order.status))}</span>
          </div>
          <div class="hb-order-meta">
            <span>${window.HB.escapeHtml(order.event_type || 'Evento')}</span>
            <span>${window.HB.escapeHtml(order.event_date || 'Sin fecha')}</span>
            ${order.desired_budget ? `<span>Presupuesto: ${window.HB.money(order.desired_budget)}</span>` : ''}
          </div>
          <div>
            <strong>Ubicación</strong>
            <p class="hb-muted">${window.HB.escapeHtml(order.event_address || 'No indicada')}</p>
            ${link ? `<a class="hb-small-link" href="${window.HB.escapeAttr(link)}" target="_blank" rel="noopener">Abrir ubicación</a>` : ''}
          </div>
          <div>
            <strong>Notas</strong>
            <p class="hb-muted" style="white-space:pre-wrap">${window.HB.escapeHtml(order.notes || 'Sin notas')}</p>
          </div>
          <div class="hb-order-actions">
            <select data-status-id="${order.id}">
              ${['new','contacted','quoted','confirmed','completed','cancelled'].map(value => `<option value="${value}" ${value === order.status ? 'selected' : ''}>${statusLabel(value)}</option>`).join('')}
            </select>
            <button class="hb-button secondary" data-update-id="${order.id}" type="button">Guardar estado</button>
            <button class="hb-button hb-danger-button" data-delete-id="${order.id}" type="button">Borrar</button>
          </div>
        </article>
      `;
    }

    async function loadOrders() {
      const client = window.HB.client();
      if (!client) {
        document.getElementById('ordersGrid').innerHTML = '<div class="hb-alert warn">Conecta Supabase para ver pedidos reales.</div>';
        return;
      }
      const { data, error } = await client
        .from('orders')
        .select('id, order_number, client_name, client_phone, client_email, event_date, event_type, event_address, desired_budget, notes, status, created_at')
        .order('created_at', { ascending: false })
        .limit(50);
      if (error) throw error;
      document.getElementById('ordersGrid').innerHTML = (data || []).length ? data.map(orderCard).join('') : '<div class="hb-alert warn">Todavía no hay pedidos.</div>';
    }

    async function updateOrderStatus(id) {
      const client = window.HB.client();
      const status = document.querySelector(`[data-status-id="${id}"]`).value;
      const { error } = await client.from('orders').update({ status }).eq('id', id);
      if (error) throw error;
      showMessage('Estado actualizado.', 'info');
      await loadOrders();
    }

    async function deleteOrder(id) {
      if (!confirm('¿Borrar este pedido? Esta acción no se puede deshacer.')) return;
      const client = window.HB.client();
      const { error } = await client.from('orders').delete().eq('id', id);
      if (error) throw error;
      showMessage('Pedido borrado.', 'info');
      await loadOrders();
    }

    document.addEventListener('click', async (event) => {
      const updateBtn = event.target.closest('[data-update-id]');
      const deleteBtn = event.target.closest('[data-delete-id]');
      try {
        if (updateBtn) await updateOrderStatus(updateBtn.dataset.updateId);
        if (deleteBtn) await deleteOrder(deleteBtn.dataset.deleteId);
      } catch (error) {
        showMessage(error.message || 'No se pudo realizar la acción.', 'danger');
      }
    });

    async function init() {
      if (!window.HB.isConfigured()) {
        document.getElementById('loginRequired').style.display = 'none';
        document.getElementById('ordersPanel').style.display = 'block';
        await loadOrders();
        return;
      }
      const session = await window.HB.getSession();
      if (!session) {
        document.getElementById('loginRequired').style.display = 'block';
        document.getElementById('ordersPanel').style.display = 'none';
        return;
      }
      document.getElementById('loginRequired').style.display = 'none';
      document.getElementById('ordersPanel').style.display = 'block';
      await loadOrders();
    }

    document.getElementById('refreshButton').addEventListener('click', loadOrders);
    document.getElementById('logoutButton').addEventListener('click', async () => { await window.HB.signOut(); window.location.href = 'login.html'; });
    init();
  </script>
</body>
</html>
